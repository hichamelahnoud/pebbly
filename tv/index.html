<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pebbly Live</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI Variable","Segoe UI",Tahoma,sans-serif;color:#f7f8fb;--accent:110,155,255;--panel:rgba(15,16,22,.74)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{padding:12px;display:flex;flex-direction:column;gap:10px;background:
 radial-gradient(80% 55% at 50% -15%,rgba(var(--accent),.22),transparent 72%),
 linear-gradient(145deg,rgba(13,14,19,.83),rgba(5,6,9,.9));transition:background .4s ease}
body::before{content:"";position:fixed;inset:-35px;z-index:-1;backdrop-filter:blur(28px) saturate(145%);background:rgba(8,9,13,.4)}
button,input{font:inherit}button{cursor:pointer;color:inherit}
.tabs{display:flex;align-items:center;gap:5px;padding:4px;border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(255,255,255,.045);flex:0 0 auto}
.tab{height:34px;min-width:86px;border:0;border-radius:10px;padding:0 16px;background:transparent;color:#aeb2bd;font-weight:650;transition:.18s ease}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}.tab.active{color:#fff;background:rgba(var(--accent),.2);box-shadow:inset 0 0 0 1px rgba(var(--accent),.3)}
button:focus-visible,input:focus-visible{outline:2px solid rgba(var(--accent),.9);outline-offset:2px}
.screen{position:relative;width:min(100%,calc((100vh - 186px)*16/9));aspect-ratio:16/9;align-self:center;flex:0 0 auto;overflow:hidden;isolation:isolate;border-radius:18px;background:rgba(2,3,5,.7);border:1px solid rgba(255,255,255,.09);box-shadow:0 18px 48px rgba(0,0,0,.38);transition:box-shadow .35s,border-color .35s}
.screen.playing{border-color:rgba(var(--accent),.36);box-shadow:0 18px 58px rgba(0,0,0,.48),0 0 38px rgba(var(--accent),.12)}
.screen video,.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#020203}.screen video{object-fit:cover}
#noise{position:absolute;inset:0;width:100%;height:100%;opacity:.11;filter:contrast(1.2)}
.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;color:#6f7480}
.empty .mark{width:58px;height:42px;margin:auto;border:1px solid rgba(255,255,255,.18);border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:750;letter-spacing:2px;background:rgba(255,255,255,.035)}
.screen-tools{position:absolute;z-index:5;left:10px;top:10px;display:flex;gap:6px;opacity:.25;transition:.2s}.screen:hover .screen-tools{opacity:1}
.icon-button{width:34px;height:34px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(8,9,12,.72);display:grid;place-items:center;font-size:17px;backdrop-filter:blur(12px)}
.icon-button:hover{background:rgba(255,255,255,.14)}
.radio-stage{position:absolute;inset:0;display:grid;place-items:center;background:
 radial-gradient(circle at 50% 35%,rgba(var(--accent),.26),transparent 42%),
 linear-gradient(145deg,rgba(20,22,29,.92),rgba(5,6,9,.96))}
.radio-card{width:min(78%,360px);text-align:center}.radio-logo{width:84px;height:84px;object-fit:contain;border-radius:22px;background:rgba(255,255,255,.94);padding:9px;box-shadow:0 16px 45px rgba(0,0,0,.35)}
.radio-name{margin:12px 0 10px;font-size:18px;font-weight:720}.radio-stage audio{width:100%;height:36px;filter:sepia(.12) saturate(.85)}
.message{min-height:30px;display:flex;align-items:center;gap:7px;flex:0 0 auto;padding-inline:3px}
#status{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#aaafba;font-size:12px}
.action{height:30px;border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:0 11px;background:rgba(255,255,255,.06);font-size:12px;font-weight:600}.action:hover{background:rgba(255,255,255,.12)}
.editor{display:grid;grid-template-columns:minmax(90px,140px) minmax(150px,1fr) auto auto;gap:6px;flex:0 0 auto}
.editor input{height:36px;min-width:0;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:0 11px;color:#f5f6f8;background:rgba(255,255,255,.055)}
.editor input::placeholder{color:#737883}.editor input[name=url]{direction:ltr}.editor .action{height:36px;background:rgba(var(--accent),.16);border-color:rgba(var(--accent),.25)}
.channels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:58px;gap:7px;overflow:auto;min-height:58px;align-content:start;padding:1px 3px 3px 1px;scrollbar-width:thin;scrollbar-color:rgba(var(--accent),.42) transparent;overscroll-behavior:contain}
.channels::-webkit-scrollbar{width:8px}.channels::-webkit-scrollbar-track{background:transparent}.channels::-webkit-scrollbar-thumb{background:linear-gradient(rgba(var(--accent),.56),rgba(var(--accent),.24));border-radius:20px;border:2px solid transparent;background-clip:padding-box}.channels::-webkit-scrollbar-thumb:hover{background-color:rgba(var(--accent),.75)}
.channel-wrap{position:relative;min-width:0}.channel{width:100%;height:100%;display:flex;align-items:center;gap:10px;text-align:right;min-width:0;padding:7px 9px;border:1px solid rgba(255,255,255,.07);border-radius:13px;background:rgba(255,255,255,.035);transition:.18s}
.channel:hover{transform:translateY(-1px);background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.13)}.channel.selected{background:rgba(var(--accent),.15);border-color:rgba(var(--accent),.42);box-shadow:inset 3px 0 0 rgba(var(--accent),.75)}
.logo{flex:0 0 42px;width:42px;height:42px;object-fit:contain;border-radius:11px;background:#f5f5f6;padding:5px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.channel .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:650}.remove{position:absolute;left:4px;top:12px;width:28px;height:28px;border:0;border-radius:9px;background:transparent;color:#8d929d;font-size:18px}.remove:hover{background:rgba(255,90,105,.13);color:#ff8c97}.channel-wrap.removable .channel{padding-inline-end:34px}
[hidden]{display:none!important}#import{display:none}
@media(max-width:520px){body{padding:9px}.channels{grid-template-columns:repeat(2,minmax(0,1fr))}.editor{grid-template-columns:1fr auto}.editor input[name=name]{grid-column:1/-1}.editor input[name=url]{grid-column:1/2}.tab{min-width:72px;padding:0 10px}}
</style>
</head>
<body>
<nav class="tabs" id="tabs">
  <button id="tnt" class="tab active" aria-pressed="true">TNT</button>
  <button id="radio" class="tab" aria-pressed="false">الراديو</button>
  <button id="iptv" class="tab" aria-pressed="false">IPTV</button>
</nav>
<section class="screen" id="screen">
  <canvas id="noise" width="180" height="102"></canvas>
  <div class="empty" id="empty"><div class="mark">LIVE</div></div>
  <video id="video" controls playsinline></video>
  <iframe id="frame" title="البث المباشر" allow="autoplay; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div class="radio-stage" id="radioStage" hidden>
    <div class="radio-card"><img id="radioLogo" class="radio-logo" alt=""><div id="radioName" class="radio-name"></div><audio id="audio" controls></audio></div>
  </div>
  <div class="screen-tools"><button class="icon-button" id="screenFull" title="ملء الشاشة" aria-label="ملء الشاشة">⛶</button></div>
</section>
<div class="message"><span id="status" role="status" aria-live="polite"></span><button class="action" id="retry" hidden>إعادة</button><button class="action" id="stop" hidden>إيقاف</button></div>
<form class="editor" id="editor" hidden>
  <input name="name" placeholder="اسم القناة" maxlength="80" required>
  <input name="url" placeholder="رابط البث" maxlength="2048" required>
  <button class="action" type="submit">إضافة</button>
  <button class="action" type="button" id="importButton">M3U</button>
  <input id="import" type="file" accept=".m3u,.m3u8,.json">
</form>
<div class="channels" id="channels"></div>
<script src="hls.min.js"></script><script src="tv-data.js"></script><script src="tv.js"></script>
</body></html>
