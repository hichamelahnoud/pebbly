<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pebbly Live</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI Variable","Segoe UI",Tahoma,sans-serif;color:#f7f9ff;--accent:110,155,255;--ambient:none}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{position:relative;isolation:isolate;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-radius:26px;background:linear-gradient(145deg,rgba(30,39,53,.62),rgba(12,17,26,.62))}
body::before{content:"";position:fixed;inset:0;z-index:-3;background:rgba(10,14,22,.14)}
body::after{content:"";position:fixed;inset:0;z-index:-2;background-image:var(--ambient);background-position:center;background-size:cover;filter:blur(80px) saturate(1.4);opacity:.12;pointer-events:none}
button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid rgba(var(--accent),.9);outline-offset:2px}
.window-bar{direction:ltr;display:flex;align-items:center;flex:0 0 28px;padding:0 2px 0 3px;user-select:none}.brand{font-size:17px;font-weight:750;letter-spacing:-.45px;pointer-events:none}.window-actions{margin-left:auto;display:flex;gap:3px}.window-button{width:29px;height:28px;display:grid;place-items:center;padding:0;border:0;border-radius:9px;color:#d0d8e4;background:transparent}.window-button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7}.window-button:hover{background:#ffffff19;color:white}.window-button.close:hover{background:#b74454}
.tabs{display:flex;align-items:center;gap:3px;flex:0 0 38px;min-width:0}
.tab{height:36px;min-width:76px;border:0;border-radius:13px;padding:0 15px;background:transparent;color:#c6cedc;font-weight:650;font-size:14px;transition:background .18s,color .18s}.tab:hover{background:#ffffff12;color:white}.tab.active{color:white;background:rgba(var(--accent),.26)}
.search{margin-inline-start:auto;width:min(160px,29vw);min-width:0;height:35px;border:0;border-radius:12px;background:#ffffff12;color:white;padding:0 12px;outline:0;font-size:13px}.search::placeholder{color:#bec8d6}.search:focus{background:#ffffff1e}
.screen{position:relative;width:min(100%,calc((100vh - 220px)*16/9));aspect-ratio:16/9;align-self:center;flex:0 0 auto;overflow:hidden;isolation:isolate;border-radius:21px;background:linear-gradient(145deg,#111b2a,#0c111b)}
body:has(.editor:not([hidden])) .screen{width:min(100%,calc((100vh - 264px)*16/9))}
.screen video,.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#07090e}.screen video{object-fit:contain}.screen:fullscreen{width:100%;height:100%;border-radius:0;aspect-ratio:auto}
#noise{display:none!important}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;gap:12px;color:#aebbd0}.empty .mark{margin:auto;width:58px;height:58px;border-radius:19px;display:grid;place-items:center;color:#dce7fa;background:#ffffff10}.empty .mark svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.6}.empty strong{font-size:16px;color:#e5ebf5}.empty small{font-size:12px}
.screen-tools{position:absolute;z-index:5;left:12px;top:12px;display:flex;opacity:.72}.screen:hover .screen-tools{opacity:1}.icon-button{width:33px;height:33px;border:0;border-radius:11px;background:#101622a8;display:grid;place-items:center;font-size:19px}.icon-button:hover{background:#354256}
.radio-stage{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 24% 24%,rgba(var(--accent),.44),transparent 74%),linear-gradient(135deg,#263347,#111923);overflow:hidden}
.radio-stage::before{content:"";position:absolute;inset:-50px;background-image:var(--ambient);background-size:cover;background-position:center;filter:blur(60px);opacity:.12;pointer-events:none}
.radio-card{position:relative;direction:ltr;width:min(82%,520px);display:grid;grid-template-columns:116px minmax(0,1fr);gap:18px 24px;align-items:center;text-align:left}
.radio-logo{width:116px;height:116px;object-fit:contain;border-radius:26px;background:#f6f8fc;padding:9px;box-shadow:0 12px 35px #0003}
.radio-info{min-width:0;display:grid;gap:7px}.radio-kicker{font-size:10px;letter-spacing:2px;color:#d5dce8;font-weight:700}.radio-name{font-size:clamp(17px,3.4vw,25px);font-weight:750;line-height:1.16;overflow-wrap:anywhere}.radio-frequency{font-size:13px;color:#d6dfeb}.radio-live{display:flex;align-items:center;gap:7px;font-size:11px;color:#dce6f4}.radio-live i{width:7px;height:7px;border-radius:50%;background:#b9c6d8}.radio-stage.is-playing .radio-live i{background:#5be3a7;box-shadow:0 0 10px #5be3a777}
.radio-controls{grid-column:1/-1;display:flex;gap:13px;align-items:center;padding:12px 15px;border-radius:20px;background:#ffffff12}.radio-play{width:44px;height:44px;flex:0 0 44px;border:0;border-radius:50%;background:#f3f6ff;color:#18202d;display:grid;place-items:center}.radio-play svg{width:21px;height:21px;fill:currentColor}.radio-play:hover{background:white}.radio-volume{display:flex;align-items:center;gap:8px;min-width:0;margin-left:auto}.radio-volume svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7}.radio-volume input{width:76px;max-width:16vw;accent-color:#f4f6ff;cursor:pointer}.radio-wave{height:30px;display:flex;align-items:center;gap:4px;flex:1;overflow:hidden}.radio-wave i{flex:1;max-width:5px;min-width:2px;height:var(--h);border-radius:4px;background:#d6e1f0;opacity:.4;transform:scaleY(.45)}.radio-stage.is-playing .radio-wave i{animation:wave .9s ease-in-out infinite alternate;animation-delay:var(--d);opacity:.8}@keyframes wave{to{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.radio-wave i{animation:none!important}}
.radio-stage audio{display:none}
.message{height:24px;display:flex;align-items:center;gap:6px;flex:0 0 24px;padding-inline:3px}#status{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d7dfeb;font-size:12px}.action{height:26px;border:0;border-radius:9px;padding:0 11px;background:#ffffff12;font-size:12px;font-weight:620}.action:hover{background:#ffffff24}
.editor{display:grid;grid-template-columns:minmax(80px,140px) minmax(90px,1fr) auto auto;gap:5px;flex:0 0 36px}.editor input{height:36px;min-width:0;border:0;border-radius:10px;padding:0 9px;color:white;background:#ffffff12;font-size:12px}.editor input::placeholder{color:#b8c2d2}.editor input[name=url]{direction:ltr}.editor .action{height:36px;background:rgba(var(--accent),.23)}
.channels{display:flex;flex:0 0 64px;min-height:64px;align-items:center;gap:7px;overflow-x:auto;overflow-y:hidden;padding:5px 7px;border-radius:18px;background:#ffffff0d;overscroll-behavior:contain;scrollbar-width:none;min-width:0}.channels::-webkit-scrollbar{display:none}
.channel-wrap{position:relative;flex:0 0 50px;width:50px;height:50px}.channel{width:100%;height:100%;display:grid;place-items:center;border:0;border-radius:14px;background:#ffffff0c;padding:4px;transition:background .16s,transform .16s;overflow:hidden}.channel:hover{background:#ffffff26;transform:translateY(-1px)}.channel.selected{background:rgba(var(--accent),.34);box-shadow:inset 0 0 0 1px rgba(var(--accent),.75)}.logo{width:40px;height:40px;object-fit:contain;border-radius:10px;background:#f7f8fb;padding:3px;display:block}.channel-copy{display:none}.remove{position:absolute;z-index:3;left:-2px;top:-2px;width:19px;height:19px;border:0;border-radius:50%;background:#293445;color:white;font-size:13px;line-height:1;padding:0}.remove:hover{background:#bd394f}.channels:empty::after{content:"No channels";color:#aab6c8;font-size:12px;padding-inline:5px}
[hidden]{display:none!important}#import{display:none}
@media(max-width:520px){body{padding:9px;gap:6px}.tab{min-width:57px;padding:0 8px;font-size:12px}.search{width:95px}.radio-card{width:83%;grid-template-columns:72px minmax(0,1fr);gap:10px}.radio-logo{width:72px;height:72px;border-radius:17px}.radio-controls{padding:7px 10px}.radio-play{width:35px;height:35px;flex-basis:35px}.radio-kicker{font-size:9px}.radio-info{gap:4px}.radio-wave{gap:2px}.channel-wrap{flex-basis:46px;width:46px;height:46px}.logo{width:36px;height:36px}}

/* Frameless layout and unboxed station artwork. */
body{border-radius:0;padding:12px 14px;background:linear-gradient(145deg,rgba(30,39,53,.62),rgba(12,17,26,.62))}
.channels{background:transparent;border-radius:0;padding:4px 0;gap:9px;justify-content:flex-start;margin-top:auto;flex:0 0 64px}
body[data-mode="tnt"] .channels{justify-content:space-between}
.channel-wrap{flex:0 0 56px;width:56px;height:56px}
.channel{background:transparent;border-radius:10px;padding:3px;overflow:visible}
.channel:hover{background:transparent;transform:translateY(-2px)}
.channel.selected{background:transparent;box-shadow:none}
.channel.selected::after{content:"";position:absolute;bottom:-3px;width:20px;height:3px;border-radius:4px;background:rgb(var(--accent))}
.logo{width:100%;height:100%;object-fit:contain;border-radius:0;background:transparent;padding:0;box-shadow:none}
.radio-logo{background:transparent;padding:0;box-shadow:none;border-radius:0}
.screen{background:#0b111b}
@media(max-width:620px){body[data-mode="tnt"] .channels{justify-content:flex-start}.channel-wrap{flex-basis:48px;width:48px;height:48px}}
</style>
</head>
<body data-mode="tnt">
<header class="window-bar glass" id="windowDrag">
 <div class="brand">Pebbly Live</div>
 <div class="window-actions">
  <button class="window-button" id="sizeWindow" title="Maximize or restore" aria-label="Maximize or restore"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg></button>
  <button class="window-button close" id="closeWindow" title="Close" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
 </div>
</header>
<nav class="tabs glass" id="tabs">
 <button id="tnt" class="tab active" aria-pressed="true">TNT</button>
 <button id="radio" class="tab" aria-pressed="false">Radio</button>
 <button id="iptv" class="tab" aria-pressed="false">IPTV</button>
 <input id="search" class="search" type="search" placeholder="Search channels" autocomplete="off">
</nav>
<section class="screen" id="screen">
 <canvas id="noise" width="180" height="102"></canvas>
 <div class="empty" id="empty"><div class="mark"><svg viewBox="0 0 32 32"><rect x="4" y="8" width="24" height="17" rx="4"/><path d="m11 3 5 5 5-5M12 29h8"/></svg></div><strong id="emptyTitle">Live TV</strong><small id="emptyHint">Choose a channel below</small></div>
 <video id="video" controls playsinline></video>
 <iframe id="frame" title="Live TV" allow="autoplay; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
 <div class="radio-stage" id="radioStage" hidden><div class="radio-card"><img id="radioLogo" class="radio-logo" alt=""><div class="radio-info"><div class="radio-kicker">PEBBLY RADIO</div><div id="radioName" class="radio-name" dir="auto"></div><div id="radioFrequency" class="radio-frequency"></div><div class="radio-live"><i></i><span id="radioState">Ready to listen</span></div></div><div class="radio-controls"><button type="button" class="radio-play" id="radioPlay" aria-label="Play"><svg viewBox="0 0 24 24"><path id="radioPlayIcon" d="M8 5v14l11-7z"/></svg></button><div class="radio-wave" id="radioWave" aria-hidden="true"><i style="--h:8px;--d:0s"></i><i style="--h:25px;--d:-0.13s"></i><i style="--h:19px;--d:-0.26s"></i><i style="--h:13px;--d:-0.39s"></i><i style="--h:30px;--d:-0.52s"></i><i style="--h:24px;--d:-0.65s"></i><i style="--h:18px;--d:-0.78s"></i><i style="--h:12px;--d:0s"></i><i style="--h:29px;--d:-0.13s"></i><i style="--h:23px;--d:-0.26s"></i><i style="--h:17px;--d:-0.39s"></i><i style="--h:11px;--d:-0.52s"></i><i style="--h:28px;--d:-0.65s"></i><i style="--h:22px;--d:-0.78s"></i><i style="--h:16px;--d:0s"></i><i style="--h:10px;--d:-0.13s"></i><i style="--h:27px;--d:-0.26s"></i><i style="--h:21px;--d:-0.39s"></i><i style="--h:15px;--d:-0.52s"></i><i style="--h:9px;--d:-0.65s"></i><i style="--h:26px;--d:-0.78s"></i><i style="--h:20px;--d:0s"></i><i style="--h:14px;--d:-0.13s"></i><i style="--h:8px;--d:-0.26s"></i></div><label class="radio-volume"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg><input id="radioVolume" type="range" min="0" max="1" step=".01" value="1" aria-label="Volume"></label></div><audio id="audio"></audio></div></div>
 <div class="screen-tools"><button class="icon-button" id="screenFull" title="Full screen" aria-label="Full screen">⛶</button></div>
</section>
<div class="message"><span id="status" role="status" aria-live="polite"></span><button class="action" id="retry" hidden>Retry</button><button class="action" id="stop" hidden>Stop</button></div>
<form class="editor" id="editor" hidden>
 <input name="name" placeholder="Channel name" maxlength="80" required>
 <input name="url" placeholder="Stream URL" maxlength="2048" required>
 <button class="action" type="submit">Add</button><button class="action" type="button" id="importButton">M3U</button>
 <input id="import" type="file" accept=".m3u,.m3u8,.json">
</form>
<div class="channels" id="channels"></div>
<script src="hls.min.js"></script><script src="tv-data.js"></script><script src="tv.js"></script>
</body></html>
