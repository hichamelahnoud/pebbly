<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pebbly TV</title>
<style>
:root{color-scheme:dark;font:13px 'Segoe UI',Tahoma,sans-serif;background:#050507;color:#eee}*{box-sizing:border-box}body{margin:0;padding:0 16px 14px;height:100vh;display:flex;flex-direction:column;gap:10px}button,input{font:inherit}button{cursor:pointer;border:0;background:#1b1b20;color:#ddd;border-radius:12px;padding:8px 13px}button:hover{background:#292930}button:focus-visible,input:focus-visible{outline:2px solid #8bb8ff;outline-offset:2px}.tabs{display:flex;gap:7px;align-items:center;flex-shrink:0}.tabs .active{background:#e9eefb;color:#111}.hint{margin-inline-start:auto;color:#85858f;font-size:11px}.screen{background:#0a0a0d;position:relative;aspect-ratio:16/9;min-height:120px;max-height:54vh;flex-shrink:0;border-radius:18px;overflow:hidden;isolation:isolate}.screen video,.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:none}.screen canvas{width:100%;height:100%;opacity:.15}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:6px;pointer-events:none;color:#8c8c98}.empty strong{font-size:23px;letter-spacing:2px;font-weight:500;color:#c4c4ce}.message{display:flex;align-items:center;gap:8px;min-height:21px;font-size:12px;color:#94949e}.message #status{flex:1}#stop,#retry{font-size:11px;padding:5px 9px}.channels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;overflow:auto;min-height:45px;align-content:start;padding:2px}.channel{display:flex;align-items:center;gap:8px;text-align:right;min-width:0;padding:9px 10px;border:1px solid #222229;background:#101014}.channel.selected{border-color:#718cb5;background:#182131}.badge{flex-shrink:0;width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:#25252e;color:#b6caff;font-size:11px}.channel .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.channel .remove{margin-inline-start:auto;color:#999;font-size:17px}.editor{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}.editor input{background:#131318;border:1px solid #2a2a33;padding:8px;border-radius:10px;color:#eee;min-width:0}.editor input[name=name]{width:100px}.editor input[name=url]{flex:1;direction:ltr;min-width:120px}.editor button{padding:8px 10px}.notice{font-size:11px;color:#757581;margin:0} [hidden]{display:none!important} #import{display:none}
</style>
<nav class="tabs" id="tabs"><button id="tnt" class="active" aria-pressed="true">TNT المغرب</button><button id="iptv" aria-pressed="false">IPTV ديالي</button><span class="hint">سكرول هنا لتبديل الإضافة</span></nav>
<section class="screen"><canvas id="noise" width="160" height="90"></canvas><div class="empty" id="empty"><strong>TV</strong><span>اختار قناة باش تبدا المشاهدة</span></div><video id="video" controls playsinline></video><iframe id="frame" title="مشغّل القناة" allow="autoplay; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe></section>
<div class="message"><span id="status" role="status" aria-live="polite">قنوات مباشرة وروابط IPTV ديالك</span><button id="retry" hidden>عاود جرّب</button><button id="stop" hidden>وقف</button></div>
<form class="editor" id="editor" hidden><input name="name" placeholder="اسم القناة" maxlength="80" required><input name="url" placeholder="https://…/stream.m3u8" maxlength="2048" required><button type="submit">زيد</button><button type="button" id="importButton">استيراد M3U</button><input id="import" type="file" accept=".m3u,.m3u8,.json"></form>
<div class="channels" id="channels"></div><p class="notice" id="notice">توفر البث كيتعلق بالقناة والمنطقة.</p>
<script src="hls.min.js"></script><script src="tv-data.js"></script><script src="tv.js"></script>
</html>
