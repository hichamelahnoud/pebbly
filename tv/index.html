<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pebbly Live</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI Variable","Segoe UI",Tahoma,sans-serif;color:#f7f8fb;--accent:110,155,255;--ambient:none}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{position:relative;isolation:isolate;padding:11px;display:flex;flex-direction:column;gap:9px;background:linear-gradient(145deg,rgba(12,13,18,.38),rgba(4,5,8,.54))}
body::before{content:"";position:fixed;inset:-40px;z-index:-3;backdrop-filter:blur(34px) saturate(155%);background:rgba(7,8,12,.23)}
body::after{content:"";position:fixed;inset:-80px;z-index:-2;background-image:var(--ambient);background-position:center;background-size:cover;filter:blur(58px) saturate(1.45);opacity:.28;transform:scale(1.18);transition:background-image .35s,opacity .35s}
button,input{font:inherit}button{cursor:pointer;color:inherit}
.glass{border:1px solid rgba(255,255,255,.09);background:rgba(18,19,25,.48);box-shadow:inset 0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(18px) saturate(140%)}
.tabs{display:flex;align-items:center;gap:5px;padding:4px;border-radius:15px;flex:0 0 auto}
.tab{height:34px;min-width:86px;border:0;border-radius:11px;padding:0 15px;background:transparent;color:#aeb2bd;font-weight:650;transition:.18s ease}
.tab:hover{color:#fff;background:rgba(255,255,255,.07)}.tab.active{color:#fff;background:rgba(var(--accent),.2);box-shadow:inset 0 0 0 1px rgba(var(--accent),.3),0 5px 16px rgba(0,0,0,.18)}
.search{margin-inline-start:auto;width:min(150px,25vw);height:32px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(0,0,0,.16);color:#f3f4f7;padding:0 11px;outline:0}.search::placeholder{color:#777c87}.search:focus{border-color:rgba(var(--accent),.58);background:rgba(0,0,0,.25)}
button:focus-visible,input:focus-visible{outline:2px solid rgba(var(--accent),.9);outline-offset:2px}
.screen{position:relative;width:min(100%,calc((100vh - 220px)*16/9));aspect-ratio:16/9;align-self:center;flex:0 0 auto;overflow:hidden;isolation:isolate;border-radius:20px;background:rgba(2,3,5,.43);border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 55px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.04);transition:box-shadow .35s,border-color .35s}
.screen.playing{border-color:rgba(var(--accent),.42);box-shadow:0 22px 60px rgba(0,0,0,.42),0 0 46px rgba(var(--accent),.15)}
.screen video,.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#020203}.screen video{object-fit:cover}
#noise{position:absolute;inset:0;width:100%;height:100%;opacity:.08;filter:contrast(1.18)}
.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;color:#737985}.empty .mark{width:62px;height:42px;margin:auto;border:1px solid rgba(255,255,255,.16);border-radius:13px;display:grid;place-items:center;font-size:13px;font-weight:720;letter-spacing:2px;background:rgba(255,255,255,.035);backdrop-filter:blur(10px)}
.screen-tools{position:absolute;z-index:5;left:10px;top:10px;display:flex;gap:6px;opacity:.4;transition:.2s}.screen:hover .screen-tools{opacity:1}
.icon-button{width:34px;height:34px;border:1px solid rgba(255,255,255,.12);border-radius:11px;background:rgba(8,9,12,.55);display:grid;place-items:center;font-size:17px;backdrop-filter:blur(14px)}.icon-button:hover{background:rgba(255,255,255,.15)}
.radio-stage{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,rgba(var(--accent),.18),rgba(5,6,9,.52));backdrop-filter:blur(24px)}
.radio-card{width:min(76%,390px);text-align:center}.radio-logo{width:88px;height:88px;object-fit:contain;border-radius:23px;background:rgba(255,255,255,.92);padding:9px;box-shadow:0 18px 50px rgba(0,0,0,.35)}.radio-name{margin:12px 0 10px;font-size:17px;font-weight:720}.radio-stage audio{width:100%;height:36px}
.message{min-height:30px;display:flex;align-items:center;gap:7px;flex:0 0 auto;padding-inline:4px}#status{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#adb2bd;font-size:12px}
.action{height:30px;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:0 12px;background:rgba(20,21,27,.46);font-size:12px;font-weight:620;backdrop-filter:blur(12px)}.action:hover{background:rgba(255,255,255,.13)}
.editor{display:grid;grid-template-columns:minmax(90px,140px) minmax(150px,1fr) auto auto;gap:6px;flex:0 0 auto}
.editor input{height:36px;min-width:0;border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:0 11px;color:#f5f6f8;background:rgba(15,16,21,.42);backdrop-filter:blur(12px)}.editor input::placeholder{color:#777c87}.editor input[name=url]{direction:ltr}.editor .action{height:36px;background:rgba(var(--accent),.16);border-color:rgba(var(--accent),.25)}
.channels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:70px;gap:8px;overflow:auto;min-height:82px;align-content:start;padding:8px 9px 9px 8px;border-radius:18px;border:1px solid rgba(255,255,255,.075);background:rgba(8,9,13,.24);backdrop-filter:blur(20px) saturate(140%);scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:rgba(var(--accent),.6) transparent;overscroll-behavior:contain}
.channels::-webkit-scrollbar{width:7px}.channels::-webkit-scrollbar-track{background:transparent;margin:10px 0}.channels::-webkit-scrollbar-thumb{background:rgba(var(--accent),.52);border-radius:20px;border:2px solid transparent;background-clip:padding-box}.channels::-webkit-scrollbar-thumb:hover{background:rgba(var(--accent),.78);background-clip:padding-box}
.channel-wrap{position:relative;min-width:0}.channel{position:relative;isolation:isolate;width:100%;height:100%;display:flex;align-items:center;gap:12px;text-align:right;min-width:0;padding:10px 11px;border:1px solid rgba(255,255,255,.075);border-radius:16px;background:linear-gradient(135deg,rgba(36,38,47,.54),rgba(18,19,25,.38));box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 7px 18px rgba(0,0,0,.12);backdrop-filter:blur(15px);overflow:hidden;transition:transform .18s,background .18s,border-color .18s,box-shadow .18s}
.channel::before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(120px 80px at 100% 0,rgba(var(--accent),.09),transparent 72%);opacity:.65;transition:.18s}.channel:hover{transform:translateY(-2px);background:linear-gradient(135deg,rgba(47,49,59,.62),rgba(24,25,32,.46));border-color:rgba(255,255,255,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 11px 24px rgba(0,0,0,.2)}.channel.selected{background:linear-gradient(135deg,rgba(var(--accent),.22),rgba(21,23,30,.58));border-color:rgba(var(--accent),.55);box-shadow:inset -3px 0 0 rgba(var(--accent),.9),0 12px 28px rgba(0,0,0,.23),0 0 20px rgba(var(--accent),.08)}.channel.selected::after{content:"";position:absolute;left:12px;top:12px;width:7px;height:7px;border-radius:50%;background:rgb(var(--accent));box-shadow:0 0 0 4px rgba(var(--accent),.13),0 0 12px rgba(var(--accent),.65)}
.logo{flex:0 0 48px;width:48px;height:48px;object-fit:contain;border-radius:14px;background:rgba(255,255,255,.96);padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.24),inset 0 0 0 1px rgba(0,0,0,.045)}.channel-copy{display:flex;min-width:0;flex:1;flex-direction:column;justify-content:center;gap:4px}.channel .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.2px;line-height:1.2;font-weight:680;color:#f5f6f9}.channel .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;line-height:1.15;font-weight:520;color:#9399a5;letter-spacing:.1px}.channel.selected .meta{color:rgba(255,255,255,.7)}.remove{position:absolute;z-index:3;left:8px;bottom:8px;width:28px;height:28px;border:0;border-radius:10px;background:rgba(10,11,15,.36);color:#a2a7b1;font-size:18px;backdrop-filter:blur(8px)}.remove:hover{background:rgba(255,90,105,.18);color:#ff9ba5}.channel-wrap.removable .channel{padding-inline-end:42px}
[hidden]{display:none!important}#import{display:none}
@media(max-width:620px){body{padding:8px}.tabs{overflow:hidden}.tab{min-width:68px;padding:0 9px}.search{width:95px}.channels{grid-template-columns:1fr}.editor{grid-template-columns:1fr auto}.editor input[name=name]{grid-column:1/-1}.editor input[name=url]{grid-column:1/2}}
</style>
</head>
<body>
<nav class="tabs glass" id="tabs">
 <button id="tnt" class="tab active" aria-pressed="true">TNT</button>
 <button id="radio" class="tab" aria-pressed="false">الراديو</button>
 <button id="iptv" class="tab" aria-pressed="false">IPTV</button>
 <input id="search" class="search" type="search" placeholder="بحث" autocomplete="off">
</nav>
<section class="screen" id="screen">
 <canvas id="noise" width="180" height="102"></canvas>
 <div class="empty" id="empty"><div class="mark">LIVE</div></div>
 <video id="video" controls playsinline></video>
 <iframe id="frame" title="البث المباشر" allow="autoplay; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
 <div class="radio-stage" id="radioStage" hidden><div class="radio-card"><img id="radioLogo" class="radio-logo" alt=""><div id="radioName" class="radio-name"></div><audio id="audio" controls></audio></div></div>
 <div class="screen-tools"><button class="icon-button" id="screenFull" title="ملء الشاشة" aria-label="ملء الشاشة">⛶</button></div>
</section>
<div class="message"><span id="status" role="status" aria-live="polite"></span><button class="action" id="retry" hidden>إعادة</button><button class="action" id="stop" hidden>إيقاف</button></div>
<form class="editor" id="editor" hidden>
 <input name="name" placeholder="اسم القناة" maxlength="80" required>
 <input name="url" placeholder="رابط البث" maxlength="2048" required>
 <button class="action" type="submit">إضافة</button><button class="action" type="button" id="importButton">M3U</button>
 <input id="import" type="file" accept=".m3u,.m3u8,.json">
</form>
<div class="channels" id="channels"></div>
<script src="hls.min.js"></script><script src="tv-data.js"></script><script src="tv.js"></script>
</body></html>
