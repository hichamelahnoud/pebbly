name: Verify TV interface
on:
  push:
    branches: [verify-tv-ui]
permissions:
  contents: read
jobs:
  ui:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tv/ui-smoke.cjs
